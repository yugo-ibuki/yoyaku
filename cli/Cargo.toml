[package]
name = "yoyaku"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Validate, enrich, and build article summary data"

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:chrono", "dep:clap", "dep:reqwest", "dep:scraper", "dep:url"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"], optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "charset"], optional = true }
scraper = { version = "=0.24.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = { version = "2.5.8", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
